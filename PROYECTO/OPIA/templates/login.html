<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="utf-8">
    <title>OPIA - Login</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <!-- Favicon -->
    <link href="{% static 'img/logo1.png' %}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&family=Inter:wght@700;800&display=swap" rel="stylesheet">
    
    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet">
    <link href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link href="{% static 'css/login.css' %}" rel="stylesheet">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>

<div class="container">
	<div class="row d-flex justify-content-center mt-5">
		<div class="col-12 col-md-8 col-lg-6 col-xl-5">
			<div class="card py-3 px-2">
				<p class="text-center mb-3 mt-2">INICIAR SESIÓN CON</p>
				{% load socialaccount %}
				<div class="row mx-auto ">
					<div class="col-6">
						<a href="{% provider_login_url 'google' %}?next=/"><i class="fab fa-google"></i></a>
					</div>
				</div>
				<div class="division">
					<div class="row">
						<div class="col-12"><span>INICIAR SESIÓN CON CORREO</span></div>
					</div>
				</div>
				<form method="POST" class="myform">
                    {% csrf_token %}
                    <div class="form-group">
    					<input type="username" name="username" class="form-control" placeholder="Nombre de Usuario" required>
                        <small>{{ form.username.errors }}</small>
  					</div>
 					<div class="form-group">
    					<input type="password" name="password" class="form-control" placeholder="Contraseña" required>
                        <small>{{ form.password.errors }}</small> 
  					</div>
  					<div class="form-group mt-3">
  						<button type="submit" class="btn btn-block btn-primary btn-lg"><small>Conectarse</small></button>
  					</div>
					<p class="text-center mb-3 mt-2">O</p>
					<div class="form-group mt-3">
  						<a href="{% url 'registro' %}" class="btn btn-block btn-primary btn-lg"><small>Registrarse</small></a>
  					</div>
				</form>
			</div>
		</div>
	</div>
</div>
<a class="btn btn-primary" href="{% url 'inicio' %}">Volver a la página principal</a>
</html>
